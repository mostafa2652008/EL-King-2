<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المدرس</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9WXBcRf8QBsRAafAcnKYVFx_kF5B0Gr0",
      authDomain: "educate-a2aad.firebaseapp.com",
      projectId: "educate-a2aad",
      storageBucket: "educate-a2aad.firebasestorage.app",
      messagingSenderId: "237633521728",
      appId: "1:237633521728:web:1ec7e6aae3ae0711ef37a5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.query = query;
    window.where = where;
    window.getDocs = getDocs;
    window.addDoc = addDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.arrayUnion = arrayUnion;
  </script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      overflow-y: auto;
      z-index: 100;
    }
    .sidebar-header {
      background: #D32F2F;
      color: white;
      padding: 30px 20px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
    }
    .sidebar-menu {
      padding: 20px 0;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 18px 30px;
      color: #555;
      text-decoration: none;
      font-size: 18px;
      transition: all 0.3s;
    }
    .menu-item:hover {
      background: #f0f0f0;
      color: #D32F2F;
    }
    .menu-item.active {
      background: #D32F2F;
      color: white;
      font-weight: 700;
    }
    .menu-item.active:hover {
      background: #b71c1c;
    }
    .menu-icon {
      font-size: 28px;
      margin-left: 16px;
    }
    .main-content {
      flex: 1;
      padding: 30px;
      margin-right: 280px;
      box-sizing: border-box;
    }
    .box {
      background: white;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background: #D32F2F;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }
    .content {
      padding: 24px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #fafafa;
      font-size: 16px;
      box-sizing: border-box;
    }
    input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #D32F2F;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        box-shadow: none;
      }
      .main-content {
        margin-right: 0;
        padding: 20px;
      }
      body {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      📚 لوحة التحكم
    </div>
    <div class="sidebar-menu">
      <a href="index.html" class="menu-item active">
        <span class="menu-icon">👨‍🏫</span>
        لوحة المدرس
      </a>
      <a href="student.html" class="menu-item">
        <span class="menu-icon">👨‍🎓</span>
        صفحة الطالب
      </a>
      <a href="cards.html" class="menu-item">
        <span class="menu-icon">🃏</span>
        عرض البطاقات
      </a>
    </div>
  </div>

  <div class="main-content">
    <div class="box">
      <div class="header">
        👨‍🏫 إضافة بطاقة جديدة
      </div>
      <div class="content">
        <div class="input-group">
          <label>اسم الـ Unit</label>
          <input type="text" id="unitName" placeholder="مثال: Unit 1 - Greetings">
        </div>
        <div class="input-group">
          <label>الكلمة بالعربي</label>
          <input type="text" id="arabic" placeholder="مثال: مرحبا">
        </div>
        <div class="input-group">
          <label>الكلمة بالإنجليزي</label>
          <input type="text" id="english" placeholder="مثال: Hello">
        </div>
        <div class="input-group">
          <label>ملف الصوت</label>
          <input type="file" id="audio" accept="audio/*">
        </div>
        <button onclick="addCard()">➕ إضافة البطاقة</button>
      </div>
    </div>
  </div>

  <script>
    let audioBase64 = "";

    document.getElementById("audio").onchange = function(e){
      const reader = new FileReader();
      reader.onload = () => audioBase64 = reader.result;
      reader.readAsDataURL(this.files[0]);
    };

    async function addCard(){
      const unitName = document.getElementById("unitName").value.trim();
      const arabic = document.getElementById("arabic").value.trim();
      const english = document.getElementById("english").value.trim();
      if(!unitName || !arabic || !english || !audioBase64){
        alert("⚠️ كمل كل البيانات");
        return;
      }

      try {
        const q = query(collection(db, "units"), where("unitName", "==", unitName));
        const querySnapshot = await getDocs(q);

        const newCard = {
          arabic,
          english,
          audio: audioBase64,
          results: {}
        };

        if (!querySnapshot.empty) {
          const unitDoc = querySnapshot.docs[0];
          await updateDoc(doc(db, "units", unitDoc.id), {
            cards: arrayUnion(newCard)
          });
        } else {
          await addDoc(collection(db, "units"), {
            unitName,
            cards: [newCard]
          });
        }

        alert("✅ تم إضافة البطاقة بنجاح!");
        document.getElementById("unitName").value = "";
        document.getElementById("arabic").value = "";
        document.getElementById("english").value = "";
        document.getElementById("audio").value = "";
        audioBase64 = "";
      } catch (e) {
        console.error("Error adding card: ", e);
        alert("حصل خطأ أثناء الحفظ");
      }
    }
  </script>
</body>
</html>
